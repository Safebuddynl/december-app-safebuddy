[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Automatically deploy when pushing to main branch
[context.production]
  command = "npm run build"
  
[context.deploy-preview]
  command = "npm run build"
